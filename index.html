<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SIGNET — премиальный кошелёк</title>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #080808;
            font-family: 'Inter', sans-serif;
            color: #C9A03D;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app {
            width: 100%;
            max-width: 440px;
            padding: 40px 24px;
        }

        /* Логотип */
        .brand-header {
            text-align: center;
            font-family: 'EB Garamond', serif;
            font-size: 28px;
            letter-spacing: 8px;
            margin-bottom: 40px;
            font-weight: 400;
        }

        /* Главная карточка баланса */
        .main-card {
            border: 1px solid rgba(201, 160, 61, 0.3);
            padding: 40px 20px;
            text-align: center;
            margin-bottom: 40px;
            background: rgba(255, 255, 255, 0.02);
        }

        .label {
            font-size: 10px;
            letter-spacing: 3px;
            opacity: 0.6;
            margin-bottom: 16px;
            text-transform: uppercase;
        }

        .amount {
            font-family: 'EB Garamond', serif;
            font-size: 48px;
            margin-bottom: 30px;
            color: #C9A03D;
        }

        .actions {
            border-top: 1px solid rgba(201, 160, 61, 0.3);
            padding-top: 20px;
            display: flex;
            justify-content: center;
            gap: 15px;
            font-size: 13px;
            letter-spacing: 4px;
        }

        .action-link { cursor: pointer; transition: 0.3s; }
        .action-link:hover { opacity: 0.7; }

        /* Списки активов и активности */
        .section-title {
            font-size: 10px;
            letter-spacing: 4px;
            margin-bottom: 24px;
            opacity: 0.6;
            text-transform: uppercase;
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid rgba(201, 160, 61, 0.1);
            font-size: 14px;
        }

        .item-name { letter-spacing: 1px; }
        .item-value { font-weight: 400; }
        .change { font-size: 11px; margin-left: 8px; }
        .positive { color: #8BC34A; }
        .negative { color: #E57373; }

        .activity-desc { color: #A78E5A; font-size: 13px; }
        .time { opacity: 0.5; font-size: 12px; }
    </style>
</head>
<body>

<div class="app">
    <div class="brand-header">SIGNET</div>

    <div class="main-card">
        <div class="label">Current Balance</div>
        <div class="amount">12,500.50 ₽</div>
        <div class="actions">
            <span class="action-link">ВВОД</span>
            <span style="opacity: 0.3">/</span>
            <span class="action-link">ВЫВОД</span>
        </div>
    </div>

    <div class="section-title">Portfolio</div>
    <div id="assetsGrid">
        <div class="item-row">
            <span class="item-name">GOLD</span>
            <span><span class="item-value">2,150.40</span><span class="change positive">+0.45%</span></span>
        </div>
        <div class="item-row">
            <span class="item-name">BRENT</span>
            <span><span class="item-value">82.30</span><span class="change negative">-1.10%</span></span>
        </div>
        <div class="item-row">
            <span class="item-name">BTC</span>
            <span><span class="item-value">67,200.15</span><span class="change positive">+2.30%</span></span>
        </div>
        <div class="item-row">
            <span class="item-name">DXY</span>
            <span><span class="item-value">103.85</span><span class="change positive">+0.12%</span></span>
        </div>
    </div>

    <div class="section-title" style="margin-top: 40px;">Latest Activity</div>
    <div id="activityList">
        <div class="item-row">
            <span class="time">21:40</span>
            <span class="activity-desc">Профит по BRENT +1.2%</span>
        </div>
        <div class="item-row">
            <span class="time">18:15</span>
            <span class="activity-desc">SMC: Слом структуры DXY</span>
        </div>
    </div>
</div>

<script>
    // Не забудь заменить на свой адрес .lhr.life из терминала!
    const API_BASE = "https://6e36be656d2a85.lhr.life"; 
    const TELEGRAM_ID = "demo_user_123";

    async function updateData() {
        try {
            const res = await fetch(`${API_BASE}/portfolio`);
            const data = await res.json();
            // Тут логика обновления цифр (как в прошлом коде)
        } catch(e) {}
    }

    setInterval(updateData, 30000);
</script>

</body>
</html>
