<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traders Club Wallet</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #1c1c1e;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .balance {
            font-size: 48px;
            font-weight: bold;
            margin: 40px 0;
        }
        .portfolio {
            width: 100%;
            max-width: 400px;
        }
        .portfolio-item {
            display: flex;
            justify-content: space-between;
            padding: 15px;
            background: #2c2c2e;
            margin-bottom: 10px;
            border-radius: 12px;
        }
        .asset-name { font-weight: bold; }
        .up { color: #34c759; }
        .down { color: #ff3b30; }
    </style>
</head>
<body>
    <h1>Traders Club</h1>
    <div id="balance" class="balance">Загрузка...</div>
    <div id="portfolio" class="portfolio"></div>

    <script>
        async function fetchData() {
            try {
                const response = await fetch('https://indissolubly-semichemical-lashell.ngrok-free.dev/balance');
                const data = await response.json();
                
                document.getElementById('balance').innerText = `$${data.balance}`;
                
                const portfolioContainer = document.getElementById('portfolio');
                portfolioContainer.innerHTML = '';
                
                data.portfolio.forEach(item => {
                    const changeClass = item.change.startsWith('+') ? 'up' : 'down';
                    portfolioContainer.innerHTML += `
                        <div class="portfolio-item">
                            <span class="asset-name">${item.asset}</span>
                            <span>$${item.price} <span class="${changeClass}">(${item.change})</span></span>
                        </div>
                    `;
                });
            } catch (error) {
                console.error('Ошибка:', error);
            }
        }
        fetchData();
        setInterval(fetchData, 5000);
    </script>
</body>
</html>
