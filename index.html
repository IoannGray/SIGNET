<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SIGNET Heritage</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Inter:wght@200;300&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #0D0D0D; /* Глубокий темный фон */
            font-family: 'Inter', sans-serif;
            color: #C9A03D; /* Золотой акцент */
            display: flex;
            justify-content: center;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .app {
            width: 100%;
            max-width: 440px;
            padding: 40px 20px;
        }

        /* Логотип: максимально тонко и широко */
        .logo {
            text-align: center;
            font-family: 'Cormorant Garamond', serif;
            font-size: 32px;
            letter-spacing: 0.6em;
            margin-bottom: 50px;
            font-weight: 300;
            text-transform: uppercase;
        }

        /* Центральная карточка с тонкой рамкой */
        .balance-card {
            border: 1px solid rgba(201, 160, 61, 0.2);
            padding: 50px 20px;
            text-align: center;
            margin-bottom: 60px;
        }

        .label {
            font-size: 10px;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            opacity: 0.5;
            margin-bottom: 25px;
            font-weight: 300;
        }

        .amount {
            font-family: 'Cormorant Garamond', serif;
            font-size: 56px;
            font-weight: 300;
            margin-bottom: 40px;
        }

        /* Кнопки ввода/вывода в рамке */
        .action-box {
            border: 1px solid rgba(201, 160, 61, 0.4);
            padding: 18px;
            display: inline-block;
            min-width: 240px;
            font-size: 12px;
            letter-spacing: 0.4em;
            cursor: pointer;
            transition: 0.3s;
        }

        .action-box:hover { background: rgba(201, 160, 61, 0.05); }

        /* Заголовки разделов */
        .section-header {
            font-family: 'Cormorant Garamond', serif;
            font-size: 12px;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            margin: 40px 0 25px;
            opacity: 0.6;
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 0.5px solid rgba(201, 160, 61, 0.1);
            font-size: 14px;
            font-weight: 300;
        }

        .ticker { letter-spacing: 0.15em; }
        .price { font-family: 'Inter', sans-serif; font-weight: 300; }
        
        .pos { color: #8BC34A; opacity: 0.7; font-size: 11px; margin-left: 8px; }
        .neg { color: #E57373; opacity: 0.7; font-size: 11px; margin-left: 8px; }

        .time { opacity: 0.4; font-size: 12px; width: 60px; }
        .activity-text { flex: 1; text-align: right; font-size: 13px; color: #C9A03D; opacity: 0.8; }

        .footer {
            margin-top: 60px;
            text-align: center;
            font-size: 9px;
            letter-spacing: 0.3em;
            opacity: 0.3;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div class="app">
    <div class="logo">SIGNET</div>

    <div class="balance-card">
        <div class="label">Current Balance</div>
        <div class="amount">12,500.50 ₽</div>
        <div class="action-box">
            ВВОД &nbsp; / &nbsp; ВЫВОД
        </div>
    </div>

    <div class="section-header">Portfolio</div>
    
    <div id="market-list">
        <div class="row">
        <span class="ticker">GOLD</span>
        <span><span class="price">2,150.40</span><span class="pos">+0.45%</span></span>
    </div>
    <div class="row">
        <span class="ticker">BRENT</span>
        <span><span class="price">82.30</span><span class="neg">-1.10%</span></span>
    </div>
    <div class="row">
        <span class="ticker">BTC</span>
        <span><span class="price">67,200.15</span><span class="pos">+2.30%</span></span>
    </div>

    <div class="section-header">Latest Activity</div>
    <div class="row">
        <span class="time">21:40</span>
        <span class="activity-text">Профит по BRENT +1.2%</span>
    </div>
    <div class="row">
        <span class="time">18:15</span>
        <span class="activity-text">SMC: Слом структуры DXY</span>
    </div>

    <div class="footer">EST. 2026 • TRADERS CLUB</div>
</div>

<script>
    // 1. УБЕДИСЬ ЧТО ЭТА ССЫЛКА СОВПАДАЕТ С ТВОИМ ТЕРМИНАЛОМ (НИЖНЕЕ ОКНО)
    const API_URL = "https://a4a2c7ef3d8ffa.lhr.life"; 

    async function updateMarket() {
        try {
            const response = await fetch(API_URL + "/portfolio");
            const data = await response.json();
            
            const list = document.getElementById('market-list');
            if (!list) return; // Если не нашел ID, ничего не делаем

            let newHtml = "";
            data.assets.forEach(asset => {
                const isPos = asset.change.includes('+');
                newHtml += `
                    <div class="row">
                        <span class="ticker">${asset.ticker}</span>
                        <span>
                            <span class="price">${asset.price.toFixed(2)}</span>
                            <span class="${isPos ? 'pos' : 'neg'}">${asset.change}</span>
                        </span>
                    </div>
                `;
            });
            list.innerHTML = newHtml;
            console.log("Данные обновлены");
        } catch (error) {
            console.error("Ошибка связи с сервером:", error);
        }
    }

    // Обновляем раз в 3 секунды
    setInterval(updateMarket, 3000);
    updateMarket(); // И один раз при запуске
</script>
