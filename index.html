<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIGNET Heritage</title>
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400&family=Montserrat:wght@100;200;300;400&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --gold: #c5a059; 
            --bg: #111417; /* Глубокий графитовый */
        }
        
        body { 
            background-color: var(--bg); 
            color: #fff; 
            font-family: 'Montserrat', sans-serif; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
            -webkit-font-smoothing: antialiased; 
            overflow-x: hidden;
        }

        /* Блок логотипа с гриффоном */
        .logo-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 60px 0 40px; /* Увеличил отступ сверху, чтобы было больше воздуха */
        }

        .gryphon-svg {
            width: 50px; /* УМЕНЬШИЛ: Теперь он будет маленьким и изящным клеймом */
            height: auto;
            margin-bottom: 20px;
            fill: var(--gold);
        }

        .logo-text { 
            font-family: 'Playfair Display', serif; 
            font-size: 20px; /* УМЕНЬШИЛ: Чтобы выглядело аккуратнее */
            letter-spacing: 16px; /* УВЕЛИЧИЛ: Больше разрядка — больше стиля Old Money */
            color: var(--gold); 
            text-transform: uppercase; 
            font-weight: 300; 
            margin-left: 16px; /* Центровка из-за letter-spacing */
        }

        /* Рамка баланса на графитовом фоне */
        .balance-frame {
            width: 90%;
            max-width: 360px;
            border: 1px solid rgba(197, 160, 89, 0.15);
            background: linear-gradient(180deg, #161a1d 0%, #0f1113 100%);
            padding: 50px 20px;
            text-align: center;
            box-sizing: border-box;
            margin-bottom: 45px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        }

        .label { 
            font-size: 9px; 
            letter-spacing: 5px; 
            color: #555; 
            text-transform: uppercase; 
            margin-bottom: 30px; 
            font-weight: 200; 
        }
        
        .balance-val { 
            font-family: 'Playfair Display', serif; 
            font-size: 46px; 
            color: var(--gold); 
            margin-bottom: 45px; 
            font-weight: 400; 
            letter-spacing: -1px;
            -webkit-font-smoothing: antialiased;
        }
        
        .currency { 
            color: var(--gold); 
            font-size: 30px; 
            margin-left: 8px; 
            font-weight: 100; 
            font-family: 'Montserrat', sans-serif;
        }

        .btn-action {
            display: inline-block;
            border: 1px solid var(--gold);
            padding: 14px 45px;
            color: var(--gold);
            text-decoration: none;
            font-size: 10px;
            letter-spacing: 7px;
            text-transform: uppercase;
            font-weight: 200;
            transition: all 0.3s ease;
        }

        /* Секции контента */
        .section-box { width: 90%; max-width: 360px; margin-bottom: 35px; }
        .section-title { 
            font-size: 9px; 
            letter-spacing: 4px; 
            color: #444; 
            text-transform: uppercase; 
            margin-bottom: 25px; 
            border-bottom: 1px solid rgba(255,255,255,0.03); 
            padding-bottom: 12px; 
        }
        
        .row-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 18px 0; 
            border-bottom: 1px solid rgba(255,255,255,0.02); 
        }
        
        .name { font-size: 11px; letter-spacing: 2px; color: var(--gold); font-weight: 300; }
        
        .price-text { 
            font-size: 14px; 
            color: #888; 
            font-weight: 200; 
            font-family: 'Montserrat', sans-serif;
        }
        
        .change { font-size: 10px; margin-left: 8px; font-weight: 500; }
        .up { color: #2ecc71; } .down { color: #e74c3c; }

        .activity-row { 
            display: flex; 
            font-size: 11px; 
            padding: 18px 0; 
            border-bottom: 1px solid rgba(255,255,255,0.02); 
        }
        .time { color: #333; width: 65px; font-weight: 200; }
        .desc { flex: 1; text-align: right; color: var(--gold); font-weight: 200; }
        .desc b { color: #fff; font-weight: 300; }
    </style>
</head>
<body>

    <div class="logo-section">
        <svg class="gryphon-svg" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
            <path d="M512 128c-15.6 0-31.2 2.4-46.1 7.1-4.7 1.5-7.3 6.5-5.8 11.2s6.5 7.3 11.2 5.8c13-4.1 26.6-6.1 40.7-6.1 70.3 0 127.5 57.2 127.5 127.5s-57.2 127.5-127.5 127.5-127.5-57.2-127.5-127.5c0-14.1 2.3-27.7 6.7-40.6 1.6-4.6-.9-9.7-5.5-11.3-4.6-1.6-9.7.9-11.3 5.5-5.1 14.9-7.7 30.6-7.7 46.4 0 79.8 64.9 144.7 144.7 144.7s144.7-64.9 144.7-144.7-64.9-144.7-144.7-144.7zM148.2 284.1c-13.8 0-25 11.2-25 25s11.2 25 25 25 25-11.2 25-25-11.2-25-25-25z m727.6 0c-13.8 0-25 11.2-25 25s11.2 25 25 25 25-11.2 25-25-11.2-25-25-25z M342.3 355.4c-42.3 0-76.6 34.3-76.6 76.6s34.3 76.6 76.6 76.6 76.6-34.3 76.6-76.6-34.4-76.6-76.6-76.6z m343.4 0c-42.3 0-76.6 34.3-76.6 76.6s34.3 76.6 76.6 76.6 76.6-34.3 76.6-76.6-34.4-76.6-76.6-76.6z" />
            <path d="M512 512c-15.6 0-31.2 2.4-46.1 7.1-13 4.1-26.6 6.1-40.7 6.1-127.5 0-231.1-103.6-231.1-231.1S297.6 63 425.1 63c127.5 0 231.1 103.6 231.1 231.1S552.6 525.2 425.1 525.2z" opacity=".2"/>
            <path d="M512 250c-20 0-40 40-60 40s-40-40-60-40-40 40-60 40-40-40-60-40c-20 0-30 60 50 60s80-60 130-60 130 60 130 60s30-60 50-60-40 40-60 40-40-40-60-40-40 40-60 40-40-40-60-40z" />
        </svg>
        <div class="logo-text">SIGNET</div>
    </div>

    <div class="balance-frame">
        <div class="label">Current Balance</div>
        <div id="balance" class="balance-val">...</div>
        <a href="#" class="btn-action">Ввод / Вывод</a>
    </div>

    <div class="section-box">
        <div class="section-title">Portfolio</div>
        <div id="portfolio"></div>
    </div>

    <div class="section-box">
        <div class="section-title">Latest Activity</div>
        <div class="activity-row">
            <span class="time">21:40</span>
            <span class="desc">Профит по <b>BRENT +1.2%</b></span>
        </div>
        <div class="activity-row">
            <span class="time">18:15</span>
            <span class="desc">SMC: <b>Слом структуры DXY</b></span>
        </div>
    </div>

    <script>
        async function sync() {
            const url = 'https://indissolubly-semichemical-lashell.ngrok-free.dev'; 
            try {
                const r = await fetch(url + '/balance', { 
                    headers: { 'ngrok-skip-browser-warning': 'true' } 
                });
                const d = await r.json();
                
                // Отображение баланса
                document.getElementById('balance').innerHTML = `${d.balance} <span class="currency">₽</span>`;
                
                // Рендеринг портфеля
                let h = '';
                d.portfolio.forEach(i => {
                    const c = i.change.startsWith('+') ? 'up' : 'down';
                    h += `<div class="row-item">
                            <span class="name">${i.asset}</span>
                            <div class="price-text">
                                ${i.price} <span class="change ${c}">${i.change}</span>
                            </div>
                          </div>`;
                });
                document.getElementById('portfolio').innerHTML = h;
            } catch (e) { console.log("Связь с сервером..."); }
        }
        sync();
        setInterval(sync, 5000);
    </script>
</body>
</html>
