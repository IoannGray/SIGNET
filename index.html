<!DOCTYPE html>
<html>
<head>
    <title>Signet</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; }
        #balance { font-size: 48px; font-weight: bold; margin: 20px 0; }
        .asset { font-size: 20px; margin: 10px; }
    </style>
</head>
<body>
    <h1>Signet</h1>
    <div id="balance">Загрузка...</div>
    <div id="portfolio"></div>

    <script>
        async function fetchData() {
            try {
                // Твоя рабочая ссылка ngrok
                const response = await fetch('https://indissolubly-semichemical-lashell.ngrok-free.dev/balance');
                const data = await response.json();
                
                document.getElementById('balance').innerText = '$' + data.balance;
                
                const portfolioContainer = document.getElementById('portfolio');
                portfolioContainer.innerHTML = '';
                
                data.portfolio.forEach(item => {
                    portfolioContainer.innerHTML += `
                        <div class="asset">
                            ${item.asset}: <strong>$${item.price}</strong> (${item.change})
                        </div>
                    `;
                });
            } catch (e) { console.log(e); }
        }
        fetchData();
        setInterval(fetchData, 5000);
    </script>
</body>
</html>
