<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIGNET Heritage</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400&family=Montserrat:wght@100;300&display=swap" rel="stylesheet">
    
    <style>
        :root { --gold: #c5a059; --bg: #111417; }
        
        body { 
            background-color: var(--bg); 
            color: #fff; 
            font-family: 'Montserrat', sans-serif; 
            margin: 0; padding: 0; 
            display: flex; flex-direction: column; align-items: center; 
            -webkit-font-smoothing: antialiased; 
        }

        .logo-section { display: flex; flex-direction: column; align-items: center; margin: 45px 0 35px; }

        /* ГРИФОН: Используем упрощенный, но надежный путь */
        .gryphon {
            width: 50px; height: 30px; margin-bottom: 15px;
            background-color: var(--gold);
            /* Маска, которая создаст силуэт грифона даже в плохом браузере */
            -webkit-mask: url('https://raw.githubusercontent.com/FortAwesome/Font-Awesome/6.x/svgs/solid/dragon.svg') no-content;
            mask: url('https://raw.githubusercontent.com/FortAwesome/Font-Awesome/6.x/svgs/solid/dragon.svg') no-repeat center;
            mask-size: contain; -webkit-mask-size: contain;
        }

        .logo-text { 
            font-family: 'Playfair Display', serif; 
            font-size: 18px; letter-spacing: 14px; color: var(--gold); 
            text-transform: uppercase; font-weight: 400; margin-left: 14px;
        }

        .balance-frame {
            width: 85%; max-width: 340px;
            border: 1px solid rgba(197, 160, 89, 0.15);
            background: linear-gradient(180deg, #161a1d 0%, #0f1113 100%);
            padding: 40px 20px; text-align: center;
            margin-bottom: 35px; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .label { font-size: 8px; letter-spacing: 4px; color: #444; text-transform: uppercase; margin-bottom: 25px; font-weight: 300; }
        
        /* ЦИФРЫ: Теперь реально 100-ка */
        .balance-val { 
            font-family: 'Montserrat', sans-serif; 
            font-size: 42px; color: var(--gold); 
            margin-bottom: 35px; font-weight: 100; 
            letter-spacing: -1px;
        }
        
        .currency { color: var(--gold); font-size: 28px; margin-left: 5px; font-weight: 100; }

        .btn-action {
            display: inline-block; border: 1px solid var(--gold);
            padding: 12px 40px; color: var(--gold); text-decoration: none;
            font-size: 9px; letter-spacing: 6px; text-transform: uppercase; font-weight: 300;
        }

        .section-box { width: 85%; max-width: 340px; margin-bottom: 30px; }
        .section-title { font-size: 8px; letter-spacing: 3px; color: #333; text-transform: uppercase; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.03); padding-bottom: 10px; }
        .row-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid rgba(255,255,255,0.02); }
        .name { font-size: 11px; letter-spacing: 1px; color: var(--gold); font-weight: 300; }
        .price-text { font-size: 13px; color: #888; font-weight: 300; }
        .change { font-size: 10px; margin-left: 5px; }
        .up { color: #2ecc71; } .down { color: #e74c3c; }
    </style>
</head>
<body>

    <div class="logo-section">
        <div class="gryphon"></div>
        <div class="logo-text">SIGNET</div>
    </div>

    <div class="balance-frame">
        <div class="label">Current Balance</div>
        <div id="balance" class="balance-val">...</div>
        <a href="#" class="btn-action">Ввод / Вывод</a>
    </div>

    <div class="section-box"><div class="section-title">Portfolio</div><div id="portfolio"></div></div>

    <script>
        async function sync() {
            const url = 'https://indissolubly-semichemical-lashell.ngrok-free.dev'; 
            try {
                const r = await fetch(url + '/balance', { headers: { 'ngrok-skip-browser-warning': 'true' } });
                const d = await r.json();
                document.getElementById('balance').innerHTML = `${d.balance} <span class="currency">₽</span>`;
                let h = '';
                d.portfolio.forEach(i => {
                    const c = i.change.startsWith('+') ? 'up' : 'down';
                    h += `<div class="row-item"><span class="name">${i.asset}</span><div class="price-text">${i.price} <span class="change ${c}">${i.change}</span></div></div>`;
                });
                document.getElementById('portfolio').innerHTML = h;
            } catch (e) {}
        }
        sync(); setInterval(sync, 5000);
    </script>
</body>
</html>
