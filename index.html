<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SIGNET Wallet</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0c0c0c;
      background-image: radial-gradient(rgba(198, 164, 63, 0.03) 1px, transparent 1px);
      background-size: 32px 32px;
      font-family: 'SF Mono', 'Menlo', 'Courier New', monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    @import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500&family=Playfair+Display:wght@300;400;500;600&display=swap');

    .banknote {
      max-width: 440px;
      width: 100%;
      background: #121212;
      background: linear-gradient(145deg, #121212 0%, #0e0e0e 100%);
      border-radius: 28px;
      padding: 32px 28px;
      box-shadow: 0 25px 40px -12px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.02), 0 0 0 1px rgba(198,164,63,0.2);
      transition: all 0.2s ease;
    }

    .watermark {
      position: relative;
      z-index: 1;
    }
    .watermark::after {
      content: "SIGNET";
      position: absolute;
      bottom: 20px;
      right: 20px;
      font-size: 10px;
      letter-spacing: 3px;
      color: #c6a43f0d;
      font-family: monospace;
      pointer-events: none;
      font-weight: 300;
    }

    .receipt-header {
      text-align: center;
      margin-bottom: 28px;
      border-bottom: 1px dashed #c6a43f30;
      padding-bottom: 16px;
    }
    .bank-name {
      font-family: 'Playfair Display', serif;
      font-weight: 400;
      font-size: 22px;
      letter-spacing: 6px;
      color: #dbbc6c;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .bank-sub {
      font-family: monospace;
      font-size: 9px;
      letter-spacing: 2px;
      color: #8e793e;
      text-transform: uppercase;
    }
    .column-icon {
      display: inline-block;
      margin: 0 6px;
      font-family: serif;
      font-size: 14px;
      color: #c6a43f;
      letter-spacing: 2px;
    }
    .column-icon::before {
      content: "‖";
      font-weight: 300;
    }

    .balance-section {
      text-align: center;
      margin: 24px 0 20px 0;
    }
    .balance-label {
      font-size: 10px;
      letter-spacing: 2px;
      color: #8e793e;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .balance-amount {
      font-family: 'Playfair Display', serif;
      font-weight: 300;
      font-size: 48px;
      color: #e7cf97;
      letter-spacing: 1px;
      text-shadow: 0 0 6px rgba(198,164,63,0.15);
      line-height: 1.1;
    }
    .balance-equiv {
      font-family: monospace;
      font-size: 12px;
      color: #5e5e64;
      margin-top: 8px;
      letter-spacing: 0.3px;
    }

    /* Блок кнопок ВВОД / ВЫВОД */
    .action-buttons {
      display: flex;
      gap: 16px;
      margin: 24px 0 20px 0;
      justify-content: center;
    }
    .btn-action {
      flex: 1;
      background: rgba(18, 18, 18, 0.8);
      border: 1px solid rgba(198, 164, 63, 0.4);
      border-radius: 48px;
      padding: 12px 0;
      font-family: monospace;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #dbbc6c;
      cursor: pointer;
      transition: all 0.2s ease;
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-action:hover {
      background: rgba(198, 164, 63, 0.1);
      border-color: #c6a43f;
      box-shadow: 0 0 8px rgba(198, 164, 63, 0.3);
      color: #f3e2b0;
    }
    .btn-action:active {
      transform: scale(0.97);
    }
    .arrow-icon {
      font-size: 18px;
      font-weight: 400;
    }

    .assets-table {
      margin: 20px 0 20px 0;
    }
    .asset-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 12px 0;
      border-bottom: 1px solid #1f1f22;
      font-size: 14px;
    }
    .asset-name {
      font-family: monospace;
      font-weight: 400;
      color: #b9b9c0;
      letter-spacing: -0.2px;
    }
    .asset-amount {
      font-family: monospace;
      font-weight: 500;
      color: #ececec;
    }
    .asset-ticker {
      font-size: 10px;
      color: #c6a43f;
      margin-left: 6px;
      letter-spacing: 0.5px;
    }

    .limit-row {
      display: flex;
      justify-content: space-between;
      margin: 16px 0 12px 0;
      padding-top: 8px;
      font-size: 12px;
      color: #a3a3aa;
      border-top: 1px solid #c6a43f20;
    }

    .receipt-footer {
      margin-top: 24px;
      text-align: right;
      font-size: 9px;
      font-family: monospace;
      color: #4a4a50;
      border-top: 1px dashed #c6a43f20;
      padding-top: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .signature {
      font-family: 'Playfair Display', serif;
      font-size: 10px;
      color: #c6a43f;
      font-style: italic;
    }

    @keyframes subtleFlash {
      0% { text-shadow: 0 0 0 #c6a43f; }
      50% { text-shadow: 0 0 6px #c6a43f80; }
      100% { text-shadow: 0 0 0 #c6a43f; }
    }
    .flash {
      animation: subtleFlash 0.4s ease;
    }

    @media (max-width: 460px) {
      .banknote { padding: 24px 20px; }
      .balance-amount { font-size: 38px; }
      .btn-action { font-size: 12px; padding: 10px 0; }
    }
  </style>
</head>
<body>
<div class="banknote watermark">
  <div class="receipt-header">
    <div class="bank-name">
      <span class="column-icon"></span> SIGNET <span class="column-icon"></span>
    </div>
    <div class="bank-sub">MULTI‑CURRENCY ACCOUNT</div>
  </div>

  <div class="balance-section">
    <div class="balance-label">TOTAL BALANCE (USD)</div>
    <div class="balance-amount" id="totalBalance">$ 12,450.80</div>
    <div class="balance-equiv" id="equivalent">≈ 0.184 BTC / 3.42 ETH</div>
  </div>

  <!-- НОВЫЙ БЛОК: кнопки ВВОД / ВЫВОД -->
  <div class="action-buttons">
    <button class="btn-action" id="depositBtn">
      <span class="arrow-icon">↑</span> ВВОД
    </button>
    <button class="btn-action" id="withdrawBtn">
      <span class="arrow-icon">↓</span> ВЫВОД
    </button>
  </div>

  <div class="assets-table" id="assetsContainer">
    <div class="asset-row">
      <span class="asset-name">Bitcoin</span>
      <span class="asset-amount">0.18420000 <span class="asset-ticker">BTC</span></span>
    </div>
    <div class="asset-row">
      <span class="asset-name">Ethereum</span>
      <span class="asset-amount">3.42100000 <span class="asset-ticker">ETH</span></span>
    </div>
    <div class="asset-row">
      <span class="asset-name">Tether (TRC20)</span>
      <span class="asset-amount">2,450.00 <span class="asset-ticker">USDT</span></span>
    </div>
    <div class="asset-row">
      <span class="asset-name">US Dollar</span>
      <span class="asset-amount">5,200.00 <span class="asset-ticker">USD</span></span>
    </div>
  </div>

  <div class="limit-row">
    <span>💳 DAILY CARD LIMIT</span>
    <span style="color:#c6a43f;">$ 4,250 remaining</span>
  </div>

  <div class="receipt-footer">
    <span class="signature">authorized signatory</span>
    <span id="timestamp">SYNC: JUST NOW</span>
  </div>
</div>

<script>
  // Обработчики кнопок (заглушки, позже добавим логику)
  document.getElementById('depositBtn').addEventListener('click', () => {
    alert('Пополнение баланса. Здесь будет форма ввода суммы и выбор валюты.');
    // В будущем: открыть модальное окно с адресом для пополнения или выбором платёжной системы.
  });
  document.getElementById('withdrawBtn').addEventListener('click', () => {
    alert('Вывод средств. Здесь будет форма для вывода на карту или крипто-адрес.');
  });

  function refreshData() {
    const now = new Date();
    const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute:'2-digit', second:'2-digit' });
    const timestampSpan = document.getElementById('timestamp');
    if (timestampSpan) {
      timestampSpan.textContent = `SYNC: ${timeStr}`;
      timestampSpan.classList.add('flash');
      setTimeout(() => timestampSpan.classList.remove('flash'), 400);
    }

    const totalSpan = document.getElementById('totalBalance');
    const currentTotal = parseFloat(totalSpan.innerText.replace('$ ', '').replace(',', ''));
    const delta = (Math.random() - 0.5) * 12;
    const newTotal = (currentTotal + delta).toFixed(2);
    totalSpan.innerText = `$ ${newTotal.replace(/\B(?=(\d{3})+(?!\d))/g, ',')}`;
    totalSpan.classList.add('flash');
    setTimeout(() => totalSpan.classList.remove('flash'), 400);
  }

  setInterval(refreshData, 15000);
  refreshData();
</script>
</body>
</html>
