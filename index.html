<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SIGNET — Private Client</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #1A1A1A; /* Глубокий графит */
            font-family: 'Inter', sans-serif;
            color: #C9A03D; /* Благородное золото */
            display: flex;
            justify-content: center;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .app {
            width: 100%;
            max-width: 440px;
            padding: 40px 25px;
        }

        /* Логотип — классическая антиква */
        .header {
            text-align: center;
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            letter-spacing: 0.4em;
            margin-bottom: 50px;
            font-weight: 400;
            text-transform: uppercase;
        }

        /* Блок баланса как на банковском чеке */
        .card-balance {
            border: 1px solid rgba(201, 160, 61, 0.25);
            padding: 50px 20px;
            text-align: center;
            background: rgba(255, 255, 255, 0.02);
            margin-bottom: 40px;
        }

        .label {
            font-size: 10px;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            opacity: 0.6;
            margin-bottom: 20px;
        }

        .main-amount {
            font-family: 'Playfair Display', serif;
            font-size: 52px;
            color: #C9A03D;
            font-weight: 400;
        }

        /* Кнопки в ряд с разделителем */
        .btn-row {
            display: flex;
            border-top: 1px solid rgba(201, 160, 61, 0.25);
            margin-top: 40px;
        }

        .btn {
            flex: 1;
            padding: 20px;
            font-size: 12px;
            letter-spacing: 0.3em;
            text-align: center;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .btn:first-child { border-right: 1px solid rgba(201, 160, 61, 0.25); }
        .btn:hover { background: rgba(201, 160, 61, 0.05); }

        /* Секции рынка и активности */
        .section-name {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 18px;
            margin: 40px 0 20px;
            border-bottom: 1px solid rgba(201, 160, 61, 0.15);
            padding-bottom: 8px;
        }

        .data-line {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            font-size: 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .ticker { font-weight: 600; letter-spacing: 1px; }
        .num { font-family: 'Inter', sans-serif; }
        
        .up { color: #A4C639; }
        .down { color: #E57373; }

        .footer {
            margin-top: 60px;
            text-align: center;
            font-size: 9px;
            letter-spacing: 3px;
            opacity: 0.3;
        }
    </style>
</head>
<body>

<div class="app">
    <div class="header">SIGNET</div>

    <div class="card-balance">
        <div class="label">Available Assets</div>
        <div class="main-amount">12,500.50 ₽</div>
        <div class="btn-row">
            <div class="btn">Deposit</div>
            <div class="btn">Withdraw</div>
        </div>
    </div>

    <div class="section-name">Market Snapshot</div>
    <div id="market">
        <div class="data-line">
            <span class="ticker">GOLD</span>
            <span class="num">2,150.40 <span class="up">+0.4%</span></span>
        </div>
        <div class="data-line">
            <span class="ticker">BRENT</span>
            <span class="num">82.30 <span class="down">-1.1%</span></span>
        </div>
        <div class="data-line">
            <span class="ticker">BTC</span>
            <span class="num">67,200.15 <span class="up">+2.3%</span></span>
        </div>
    </div>

    <div class="footer">EST. 2026 • TRADERS CLUB</div>
</div>

<script>
    // Твоя активная ссылка из терминала
    const SERVER_URL = "https://6e36be656d2a85.lhr.life"; 

    async function sync() {
        try {
            const response = await fetch(`${SERVER_URL}/portfolio`);
            const data = await response.json();
            // Здесь обновляем цифры, если сервер отдает данные
        } catch(e) {
            console.error("Connection lost");
        }
    }
    setInterval(sync, 30000);
</script>

</body>
</html>
