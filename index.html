<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SIGNET</title>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #0D0D0D; /* Глубокий графитовый как на фото */
            font-family: 'Inter', sans-serif;
            color: #C9A03D;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .app {
            width: 100%;
            max-width: 440px;
            padding: 20px 20px;
        }

        /* Заголовок SIGNET сверху */
        .top-logo {
            text-align: center;
            font-family: 'EB Garamond', serif;
            font-size: 24px;
            letter-spacing: 0.3em;
            margin: 20px 0 40px;
            font-weight: 400;
            color: #C9A03D;
        }

        /* Центральный блок с рамкой */
        .balance-card {
            border: 1px solid rgba(201, 160, 61, 0.2);
            padding: 60px 20px;
            text-align: center;
            margin-bottom: 60px;
        }

        .label {
            font-size: 11px;
            letter-spacing: 0.2em;
            opacity: 0.5;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .amount {
            font-family: 'EB Garamond', serif;
            font-size: 52px;
            color: #C9A03D;
            margin-bottom: 40px;
            font-weight: 400;
        }

        .btn-row {
            border-top: 1px solid rgba(201, 160, 61, 0.2);
            padding-top: 25px;
            display: flex;
            justify-content: center;
            gap: 20px;
            font-size: 14px;
            letter-spacing: 0.3em;
            font-weight: 300;
        }

        /* Списки PORTFOLIO и ACTIVITY */
        .section-header {
            font-size: 11px;
            letter-spacing: 0.3em;
            margin: 40px 0 20px;
            opacity: 0.5;
            text-transform: uppercase;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            padding: 18px 0;
            border-bottom: 0.5px solid rgba(201, 160, 61, 0.15);
            font-size: 14px;
            font-weight: 300;
        }

        .asset-ticker { letter-spacing: 0.1em; }
        .asset-price { font-family: 'Inter', sans-serif; }
        .percent { font-size: 11px; margin-left: 10px; }
        
        .pos { color: #8BC34A; opacity: 0.8; }
        .neg { color: #E57373; opacity: 0.8; }

        .act-time { opacity: 0.4; width: 60px; }
        .act-text { flex: 1; text-align: right; color: #C9A03D; }

    </style>
</head>
<body>

<div class="app">
    <div class="top-logo">S I G N E T</div>

    <div class="balance-card">
        <div class="label">Current Balance</div>
        <div class="amount">12,500.50 ₽</div>
        <div class="btn-row">
            <span>ВВОД</span>
            <span style="opacity: 0.2">/</span>
            <span>ВЫВОД</span>
        </div>
    </div>

    <div class="section-header">Portfolio</div>
    <div class="data-row">
        <span class="asset-ticker">GOLD</span>
        <span><span class="asset-price">2,150.40</span><span class="percent pos">+0.45%</span></span>
    </div>
    <div class="data-row">
        <span class="asset-ticker">BRENT</span>
        <span><span class="asset-price">82.30</span><span class="percent neg">-1.10%</span></span>
    </div>
    <div class="data-row">
        <span class="asset-ticker">BTC</span>
        <span><span class="asset-price">67,200.15</span><span class="percent pos">+2.30%</span></span>
    </div>
    <div class="data-row">
        <span class="asset-ticker">DXY</span>
        <span><span class="asset-price">103.85</span><span class="percent pos">+0.12%</span></span>
    </div>

    <div class="section-header">Latest Activity</div>
    <div class="data-row">
        <span class="act-time">21:40</span>
        <span class="act-text">Профит по BRENT +1.2%</span>
    </div>
    <div class="data-row">
        <span class="act-time">18:15</span>
        <span class="act-text">SMC: Слом структуры DXY</span>
    </div>
</div>

<script>
    // Твоя ссылка из терминала (обновляй её после перезапуска туннеля)
    const API_URL = "https://6e36be656d2a85.lhr.life"; 

    async function refresh() {
        try {
            const r = await fetch(`${API_URL}/portfolio`);
            const d = await r.json();
            // Здесь будет логика авто-обновления, если нужно
        } catch(e) {}
    }
    setInterval(refresh, 30000);
</script>

</body>
</html>
