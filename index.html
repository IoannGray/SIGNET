<!DOCTYPE html>
<html>
<head>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        <style>
    body { 
        background: #121212; /* Чуть темнее для глубины */
        color: #c5a059; 
        font-family: 'Cinzel', serif; 
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        justify-content: center; 
        min-height: 100vh; 
        margin: 0; 
        letter-spacing: 1px; 
    }
    
    .card { 
        border: 1px solid rgba(197, 160, 89, 0.3); /* Тонкая, едва заметная рамка */
        padding: 50px 30px; 
        text-align: center; 
        width: 280px; 
        background: #181818; 
        box-shadow: 0 20px 50px rgba(0,0,0,0.8);
    }
    
    h1 { 
        font-size: 38px; 
        margin: 20px 0; 
        font-weight: 400; 
        letter-spacing: 3px; /* Делаем цифры очень статусными */
    }
    
    .btn { 
        border: 1px solid #c5a059; 
        color: #c5a059; 
        padding: 12px; 
        margin-top: 30px; 
        text-transform: uppercase; 
        background: none; 
        width: 100%; 
        cursor: pointer; 
        font-family: 'Cinzel', serif;
        font-size: 11px;
        letter-spacing: 4px; /* Широкий интервал — признак люкса */
        transition: all 0.4s ease;
    }

    .btn:hover {
        background: rgba(197, 160, 89, 0.1);
    }

    .balance-value { transition: all 1s ease; }
</style>
    </style>
</head>
<body>
    <div style="letter-spacing: 5px; margin-bottom: 20px;">SIGNET</div>
    <div class="card">
        <div style="font-size: 10px; color: #888;">BALANCE</div>
        <h1 class="balance-value">... <span class="currency">₽</span></h1>
        <button class="btn" onclick="window.Telegram.WebApp.showAlert('Система SIGNET активна')">Ввод / Вывод</button>
    </div>
<script>
    window.Telegram.WebApp.ready();
    window.Telegram.WebApp.expand();

    async function updateBalance() {
        try {
            // Добавляем случайный параметр ?t=, чтобы обмануть кэш
            const response = await fetch('https://indissolubly-semichemical-lashell.ngrok-free.dev/balance?t=' + Date.now(), {
                headers: {
                    'ngrok-skip-browser-warning': 'true'
                }
            });
            const data = await response.json();

            // Ищем именно тот элемент, который мы пометили классом
            const el = document.querySelector('.balance-value');
            if (el) {
                el.innerHTML = data.balance + ' <span class="currency">₽</span>';
            }
        } catch (e) {
            console.log('Ошибка связи');
        }
    }

    // Запускаем сразу и потом каждые 5 секунд
    updateBalance();
    setInterval(updateBalance, 5000);
</script>
   </body>
</html>
