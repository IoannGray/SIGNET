<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGNET</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { 
            background: #121212; 
            color: #c5a059; 
            font-family: 'Cinzel', serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 40px 20px;
        }
        .brand { letter-spacing: 8px; font-size: 18px; margin-bottom: 30px; }
        .card { 
            border: 1px solid rgba(197, 160, 89, 0.3); 
            padding: 40px 20px; 
            text-align: center; 
            width: 100%; 
            max-width: 320px;
            background: #181818; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }
        .label { font-size: 10px; color: #888; letter-spacing: 3px; margin-bottom: 10px; text-transform: uppercase; }
        h1 { font-size: 36px; margin: 10px 0; font-weight: 400; letter-spacing: 2px; }
        .btn { 
            border: 1px solid #c5a059; 
            color: #c5a059; 
            padding: 12px; 
            margin-top: 30px; 
            text-transform: uppercase; 
            background: none; 
            width: 100%; 
            font-family: 'Cinzel', serif;
            font-size: 11px;
            letter-spacing: 4px;
        }
        .section { width: 100%; max-width: 320px; margin-top: 40px; }
        .item { 
            display: flex; 
            justify-content: space-between; 
            border-bottom: 1px solid rgba(197,160,89,0.1); 
            padding: 15px 0; 
            font-size: 11px; 
        }
    </style>
</head>
<body>
    <div class="brand">SIGNET</div>
    
    <div class="card">
        <div class="label">Current Balance</div>
        <h1 id="balance">... ₽</h1>
        <button class="btn" onclick="window.Telegram.WebApp.showAlert('Access Granted')">Ввод / Вывод</button>
    </div>

    <div class="section">
        <div class="label">Portfolio</div>
        <div id="portfolio-list"></div>
    </div>

    <div class="section" style="margin-bottom: 50px;">
        <div class="label">Latest Activity</div>
        <div id="history-list"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        async function updateData() {
            try {
                // ПРОВЕРЬ ЭТУ ССЫЛКУ! Она должна совпадать с твоим ngrok
                const url = 'https://indissolubly-semichemical-lashell.ngrok-free.dev/balance?t='

                
                const response = await fetch(url, { headers: { 'ngrok-skip-browser-warning': 'true' } });
                const data = await response.json();

                // 1. Баланс
                document.getElementById('balance').innerText = data.balance + ' ₽';

                // 2. Портфель
                const pList = document.getElementById('portfolio-list');
                if (data.portfolio) {
                    pList.innerHTML = data.portfolio.map(i => `
                        <div class="item">
                            <span>${i.asset}</span>
                            <span>${i.price} <small style="color:${i.change.includes('+') ? '#4caf50' : '#f44336'}">${i.change}</small></span>
                        </div>
                    `).join('');
                }

                // 3. История
                const hList = document.getElementById('history-list');
                if (data.history) {
                    hList.innerHTML = data.history.map(i => `
                        <div class="item">
                            <span style="color:#888;">${i.time}</span>
                            <span>${i.desc}</span>
                        </div>
                    `).join('');
                }
            } catch (err) {
                console.error("Fetch error:", err);
            }
        }

        setInterval(updateData, 5000);
        updateData();
    </script>
</body>
</html>
