<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Wallet</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #1c1c1e;
            --card-bg: #2c2c2e;
            --text-color: #ffffff;
            --accent-color: #007aff;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .user-info { margin-bottom: 20px; font-size: 18px; font-weight: bold; }
        .balance-card {
            background-color: var(--card-bg);
            width: 100%;
            border-radius: 20px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            margin-bottom: 30px;
        }
        .balance-label { font-size: 14px; color: #8e8e93; text-transform: uppercase; margin-bottom: 10px; }
        .balance-amount { font-size: 36px; font-weight: 800; }
        .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; }
        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-secondary { background-color: #3a3a3c; }
    </style>
</head>
<body>

    <div class="user-info" id="user-name">Загрузка...</div>

    <div class="balance-card">
        <div class="balance-label">Мой Баланс</div>
        <div class="balance-amount" id="balance">0.00 ₽</div>
    </div>

    <div class="actions">
        <button class="btn" onclick="topUp()">Пополнить</button>
        <button class="btn btn-secondary" onclick="sendMoney()">Перевести</button>
    </div>

    <script>
        // Инициализация Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем на все окно

        // Берем данные пользователя из Telegram
        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('user-name').innerText = `Привет, ${user.first_name}!`;
        }

        function topUp() {
            tg.showAlert("Функция пополнения через СБП будет доступна скоро!");
        }

        function sendMoney() {
            tg.showConfirm("Вы уверены, что хотите перейти к переводу?");
        }
    </script>
</body>
</html>
