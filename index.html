<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { 
            background: #121212; 
            color: #c5a059; 
            font-family: 'Cinzel', serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding-top: 40px;
        }
        .brand { letter-spacing: 8px; font-size: 18px; margin-bottom: 30px; }
        .card { 
            border: 1px solid rgba(197, 160, 89, 0.3); 
            padding: 40px 20px; 
            text-align: center; 
            width: 85%; 
            max-width: 320px;
            background: #181818; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .label { font-size: 10px; color: #888; letter-spacing: 3px; margin-bottom: 10px; }
        h1 { font-size: 36px; margin: 10px 0; font-weight: 400; letter-spacing: 2px; }
        .btn { 
            border: 1px solid #c5a059; 
            color: #c5a059; 
            padding: 12px; 
            margin-top: 30px; 
            text-transform: uppercase; 
            background: none; 
            width: 100%; 
            font-family: 'Cinzel', serif;
            font-size: 11px;
            letter-spacing: 4px;
        }
        .activity-section { width: 85%; max-width: 320px; margin-top: 40px; }
        .activity-item { 
            display: flex; 
            justify-content: space-between; 
            border-bottom: 1px solid rgba(197,160,89,0.1); 
            padding: 15px 0; 
            font-size: 10px; 
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="brand">SIGNET</div>
    
    <div class="card">
        <div class="label">CURRENT BALANCE</div>
        <h1 class="balance-value">... ₽</h1>
        <button class="btn" onclick="window.Telegram.WebApp.showAlert('Система активна')">Ввод / Вывод</button>
    </div>

    <div class="activity-section">
        <div class="label">LATEST ACTIVITY</div>
        <div id="history-list">
            </div>
    </div>

    <script>
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();

        async function updateBalance() {
            try {
                // Замени адрес ниже на свой актуальный ngrok, если он изменился!
                const response = await fetch('https://indissolubly-semichemical-lashell.ngrok-free.dev/balance?t=' + Date.now(), {
                    headers: { 'ngrok-skip-browser-warning': 'true' }
                });
                const data = await response.json();

                document.querySelector('.balance-value').innerText = data.balance + ' ₽';

                const historyEl = document.getElementById('history-list');
                if (data.history) {
                    historyEl.innerHTML = data.history.map(item => `
                        <div class="activity-item">
                            <span style="color: #888;">${item.time}</span>
                            <span>${item.desc}</span>
                        </div>
                    `).join('');
                }
            } catch (e) { console.error('Ошибка:', e); }
        }

        setInterval(updateBalance, 5000);
        updateBalance();
    </script>
</body>
</html>
