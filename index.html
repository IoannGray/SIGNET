<!DOCTYPE html>
<html>
<head>
    <title>Signet</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="background-color: #000; color: #fff; font-family: -apple-system, sans-serif; text-align: center; padding-top: 50px; margin: 0;">
    <h1 style="font-weight: 300; letter-spacing: 2px; text-transform: uppercase; font-size: 18px;">Signet</h1>
    <div id="balance" style="font-size: 48px; font-weight: bold; margin: 30px 0;">Загрузка...</div>
    <div id="portfolio" style="max-width: 300px; margin: 0 auto; text-align: left;"></div>

    <script>
        async function fetchData() {
            try {
                // ПРОВЕРЬ ССЫЛКУ ИЗ NGROK (второе окно терминала)
                const url = 'https://indissolubly-semichemical-lashell.ngrok-free.dev/balance';
                const response = await fetch(url);
                const data = await response.json();
                
                document.getElementById('balance').innerText = '$' + data.balance;
                
                const portfolioContainer = document.getElementById('portfolio');
                portfolioContainer.innerHTML = '';
                
                data.portfolio.forEach(item => {
                    const color = item.change.startsWith('+') ? '#34c759' : '#ff3b30';
                    portfolioContainer.innerHTML += `
                        <div style="display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 18px; border-bottom: 1px solid #222; padding-bottom: 5px;">
                            <span>${item.asset}</span>
                            <span>$${item.price} <span style="color: ${color}; font-size: 14px;">(${item.change})</span></span>
                        </div>
                    `;
                });
            } catch (e) { console.log('Error:', e); }
        }
        fetchData();
        setInterval(fetchData, 5000);
    </script>
</body>
</html>
