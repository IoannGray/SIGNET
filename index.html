<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SIGNET — премиальный кошелёк</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0A0A0A;
            font-family: 'Cinzel', 'Times New Roman', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .app {
            max-width: 480px;
            width: 100%;
            background: #111111;
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5), 0 0 0 1px rgba(212, 175, 55, 0.2);
            padding: 28px 20px 36px;
        }

        /* Заголовок и грифон */
        .header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 24px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            padding-bottom: 12px;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .griffin-icon svg {
            width: 32px;
            height: 32px;
        }
        .app-name {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 4px;
            color: #D4AF37;
        }
        .close-btn {
            color: #D4AF37;
            font-size: 20px;
            cursor: pointer;
            opacity: 0.7;
        }

        /* Баланс */
        .balance-section {
            text-align: center;
            margin-bottom: 28px;
        }
        .balance-label {
            font-size: 11px;
            letter-spacing: 2px;
            color: rgba(212, 175, 55, 0.6);
            margin-bottom: 6px;
        }
        .balance-amount {
            font-size: 42px;
            font-weight: 700;
            color: #D4AF37;
        }
        .balance-currency {
            font-size: 18px;
            font-weight: 500;
            margin-left: 4px;
        }

        /* Кнопки ввод/вывод */
        .action-row {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-bottom: 36px;
        }
        .action-btn {
            background: transparent;
            border: 1.5px solid #D4AF37;
            padding: 8px 28px;
            font-family: 'Cinzel', serif;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 2px;
            color: #D4AF37;
            text-transform: uppercase;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.2s;
            background: rgba(0,0,0,0.4);
        }
        .action-btn:hover {
            background: rgba(212,175,55,0.15);
            border-color: #E5C158;
        }

        /* Портфолио */
        .portfolio-title {
            font-size: 14px;
            letter-spacing: 3px;
            color: #D4AF37;
            margin-bottom: 12px;
            border-left: 2px solid #D4AF37;
            padding-left: 10px;
        }
        .assets-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 32px;
        }
        .asset-item {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            border-bottom: 1px dashed rgba(212,175,55,0.2);
            padding-bottom: 8px;
        }
        .asset-name {
            font-weight: 500;
            color: #D4AF37;
            font-size: 15px;
        }
        .asset-value {
            font-weight: 600;
            color: #E8D18C;
            font-size: 15px;
        }
        .asset-change {
            font-size: 12px;
            margin-left: 8px;
            font-weight: 500;
        }
        .positive {
            color: #2ecc71;
        }
        .negative {
            color: #e74c3c;
        }

        /* Лента активности */
        .activity-title {
            font-size: 14px;
            letter-spacing: 3px;
            color: #D4AF37;
            margin-bottom: 12px;
            border-left: 2px solid #D4AF37;
            padding-left: 10px;
        }
        .activity-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .activity-item {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #bbaa77;
            border-bottom: 1px dotted rgba(212,175,55,0.15);
            padding-bottom: 6px;
        }
        .activity-time {
            font-weight: 500;
            letter-spacing: 0.5px;
        }
        .activity-desc {
            text-align: right;
            max-width: 70%;
        }

        .footer-note {
            margin-top: 28px;
            text-align: center;
            font-size: 8px;
            color: rgba(212,175,55,0.3);
        }
    </style>
</head>
<body>
<div class="app">
    <div class="header">
        <div class="logo-area">
            <div class="griffin-icon">
                <svg viewBox="0 0 40 40" width="32" height="32">
                    <path d="M20 5 L28 15 L24 25 L32 30 L28 38 L20 34 L12 38 L8 30 L16 25 L12 15 L20 5Z" fill="#C9A03D" stroke="#D4AF37" stroke-width="0.8"/>
                    <circle cx="20" cy="18" r="3" fill="#111"/>
                </svg>
            </div>
            <div class="app-name">SIGNET</div>
        </div>
        <div class="close-btn">✕</div>
    </div>

    <div class="balance-section">
        <div class="balance-label">CURRENT BALANCE</div>
        <div class="balance-amount">12,500.50<span class="balance-currency">₽</span></div>
    </div>

    <div class="action-row">
        <button class="action-btn" id="depositBtn">ВВОД</button>
        <button class="action-btn" id="withdrawBtn">ВЫВОД</button>
    </div>

    <div class="portfolio-title">PORTFOLIO</div>
    <div class="assets-grid" id="assetsGrid">
        <!-- Данные будут заполнены из API -->
        <div class="asset-item"><span class="asset-name">GOLD</span><span><span class="asset-value">—</span><span class="asset-change"></span></span></div>
        <div class="asset-item"><span class="asset-name">BRENT</span><span><span class="asset-value">—</span><span class="asset-change"></span></span></div>
        <div class="asset-item"><span class="asset-name">BTC</span><span><span class="asset-value">—</span><span class="asset-change"></span></span></div>
        <div class="asset-item"><span class="asset-name">DXY</span><span><span class="asset-value">—</span><span class="asset-change"></span></span></div>
    </div>

    <div class="activity-title">LATEST ACTIVITY</div>
    <div class="activity-list" id="activityList">
        <div class="activity-item"><span class="activity-time">--:--</span><span class="activity-desc">Загрузка...</span></div>
    </div>
    <div class="footer-note">SIGNET • ЗАЩИЩЕННЫЙ КОШЕЛЁК</div>
</div>

<script>
    // Базовый URL бэкенда (потом замените на реальный)
    const API_BASE = "http://localhost:8000";
    // Для теста используем demo telegram_id, в реальном WebApp получите из Telegram.WebApp.initDataUnsafe.user.id
    const TELEGRAM_ID = "demo_user_123";

    // Функция загрузки портфеля (цены + изменения)
    async function loadPortfolio() {
        try {
            const resp = await fetch(`${API_BASE}/portfolio`);
            if (!resp.ok) throw new Error();
            const data = await resp.json();
            // data = { "GOLD": {price, change_percent}, "BRENT": ..., "BTC": ..., "DXY": ... }
            const assets = ["GOLD", "BRENT", "BTC", "DXY"];
            const container = document.getElementById("assetsGrid");
            const items = container.querySelectorAll(".asset-item");
            for (let i = 0; i < assets.length; i++) {
                const sym = assets[i];
                const info = data[sym];
                if (info) {
                    const price = info.price.toFixed(2);
                    const change = info.change_percent.toFixed(2);
                    const changeClass = change >= 0 ? "positive" : "negative";
                    const sign = change >= 0 ? "+" : "";
                    items[i].querySelector(".asset-value").innerText = `${price} ${sym === "DXY" ? "" : "$"}`;
                    items[i].querySelector(".asset-change").innerHTML = `<span class="${changeClass}">${sign}${change}%</span>`;
                }
            }
        } catch(e) {
            console.warn("Ошибка загрузки портфеля", e);
        }
    }

    // Функция загрузки активности
    async function loadActivity() {
        try {
            const resp = await fetch(`${API_BASE}/activity/${TELEGRAM_ID}`);
            if (!resp.ok) throw new Error();
            const activities = await resp.json(); // [{time: "21:40", description: "Профит по BRENT +1.2%"}, ...]
            const container = document.getElementById("activityList");
            if (activities.length === 0) {
                container.innerHTML = '<div class="activity-item"><span class="activity-time">—</span><span class="activity-desc">Нет активности</span></div>';
                return;
            }
            container.innerHTML = activities.map(act => `
                <div class="activity-item">
                    <span class="activity-time">${act.time}</span>
                    <span class="activity-desc">${act.description}</span>
                </div>
            `).join('');
        } catch(e) {
            console.warn("Ошибка загрузки активности", e);
        }
    }

    // Загрузка баланса
    async function loadBalance() {
        try {
            const resp = await fetch(`${API_BASE}/balance/${TELEGRAM_ID}`);
            if (resp.ok) {
                const data = await resp.json();
                const balanceElem = document.querySelector(".balance-amount");
                if (data.balance !== undefined) {
                    balanceElem.innerHTML = `${data.balance.toLocaleString()}<span class="balance-currency">₽</span>`;
                }
            }
        } catch(e) {}
    }

    // Обработчики кнопок
    document.getElementById("depositBtn").onclick = () => alert("Пополнение будет доступно в ближайшее время");
    document.getElementById("withdrawBtn").onclick = () => alert("Вывод средств через защищённый канал");

    // Инициализация
    loadPortfolio();
    loadActivity();
    loadBalance();
    setInterval(() => { loadPortfolio(); }, 60000); // обновление цен раз в минуту
</script>
</body>
</html>
