<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIGNET</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0d0d0d;
            color: #dcb065; /* Базовый золотой цвет текста */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ЗОЛОТОЙ ГРАДИЕНТ ДЛЯ ТЕКСТА */
        .gold-text {
            background: linear-gradient(135deg, #f7dfa4 0%, #dcb065 50%, #ae8b49 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-fill-color: transparent;
        }

        .main-header {
            font-family: 'Cinzel', serif;
            font-size: 14px;
            letter-spacing: 5px;
            margin-top: 10px;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        /* ЦЕНТРАЛЬНЫЙ БЛОК */
        .balance-box {
            width: 90%;
            max-width: 360px;
            border: 1px solid #dcb065; /* Тонкая золотая рамка */
            padding: 30px 20px;
            text-align: center;
            margin-bottom: 40px;
        }

        .balance-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #999;
            margin-bottom: 15px;
        }

        .balance-value {
            font-family: 'Cinzel', serif;
            font-size: 44px;
            font-weight: 700;
            margin-bottom: 30px;
        }

        /* КНОПКА ВВОД / ВЫВОД */
        .action-button {
            width: 100%;
            border: 1px solid #dcb065;
            padding: 12px 0;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #dcb065;
            background: transparent;
            font-weight: bold;
        }

        /* СПИСКИ И ЗАГОЛОВКИ РАЗДЕЛОВ */
        .section-header {
            width: 100%;
            max-width: 360px;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #999;
            margin-bottom: 15px;
            text-align: left;
        }

        .portfolio-list, .activity-list {
            width: 100%;
            max-width: 360px;
            margin-bottom: 40px;
        }

        .item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #222; /* Тонкая разделительная линия */
        }

        .item:last-child {
            border-bottom: none;
        }

        .asset-name, .activity-time {
            font-size: 11px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .asset-data, .activity-text {
            text-align: right;
            font-size: 11px;
            letter-spacing: 0.5px;
        }

        .up { color: #50b06a; } /* Сдержанный зеленый */
        .down { color: #bf4d4d; } /* Сдержанный красный */

    </style>
</head>
<body>
    <div class="main-header gold-text">SIGNET</div>

    <div class="balance-box">
        <div class="balance-label">Current Balance</div>
        <div id="balance" class="balance-value gold-text">Загрузка...</div>
        <button class="action-button">Ввод / Вывод</button>
    </div>

    <div class="section-header">Portfolio</div>
    <div id="portfolio" class="portfolio-list"></div>

    <div class="section-header">Latest Activity</div>
    <div class="activity-list">
        <div class="item">
            <div class="activity-time">21:40</div>
            <div class="activity-text gold-text">Профит по Brent +1.2%</div>
        </div>
        <div class="item">
            <div class="activity-time">18:15</div>
            <div class="activity-text gold-text">SMC: Слом структуры DXY</div>
        </div>
    </div>

    <script>
        async function fetchData() {
            try {
                // Подставь свою рабочую ссылку ngrok
                const url = 'https://indissolubly-semichemical-lashell.ngrok-free.dev/balance';
                const response = await fetch(url);
                const data = await response.json();
                
                // Отображаем баланс с валютой ₽
                document.getElementById('balance').innerText = `${data.balance} ₽`;
                
                const portfolioContainer = document.getElementById('portfolio');
                portfolioContainer.innerHTML = '';
                
                data.portfolio.forEach(item => {
                    const changeClass = item.change.startsWith('+') ? 'up' : 'down';
                    portfolioContainer.innerHTML += `
                        <div class="item">
                            <div class="asset-name">${item.asset}</div>
                            <div class="asset-data">
                                <span>${item.price}</span>
                                <span class="${changeClass}">${item.change}</span>
                            </div>
                        </div>
                    `;
                });
            } catch (error) {
                console.error('Ошибка:', error);
                document.getElementById('balance').innerText = "Ошибка";
            }
        }
        fetchData();
        setInterval(fetchData, 5000); // Обновление каждые 5 секунд
    </script>
</body>
</html>
