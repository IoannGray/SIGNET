<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIGNET Heritage</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400&family=Montserrat:wght@100;200;300;400&display=swap" rel="stylesheet">
    <style>
        :root { 
            --gold: #c5a059; 
            --bg: #111417; 
        }
        
        body { 
            background-color: var(--bg); 
            color: #fff; 
            font-family: 'Montserrat', sans-serif; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
            -webkit-font-smoothing: antialiased; 
        }
        
        /* Блок логотипа с гриффоном */
        .logo-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 50px 0 45px;
        }

        /* ИЗМЕНЕНИЕ: Стили для PNG изображения */
        .gryphon-img {
            width: 70px; /* Уменьшенный размер для изящества */
            height: auto;
            margin-bottom: 15px;
            /* Принудительный золотой оттенок для картинки */
            filter: sepia(1) saturate(5) hue-rotate(10deg); 
            opacity: 0.9;
        }

        .logo-text { 
            font-family: 'Playfair Display', serif; 
            font-size: 24px; 
            letter-spacing: 14px; 
            color: var(--gold); 
            text-transform: uppercase; 
            font-weight: 400; /* В сочетании с Playfair дает идеальную нить */
            margin-left: 14px; /* Компенсация letter-spacing для центровки */
        }

        /* ... остальные стили (как в прошлый раз) ... */
        
        .balance-frame {
            width: 90%;
            max-width: 360px;
            border: 1px solid rgba(197, 160, 89, 0.15);
            background: linear-gradient(180deg, #161a1d 0%, #0f1113 100%);
            padding: 50px 20px;
            text-align: center;
            box-sizing: border-box;
            margin-bottom: 45px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        }

        .label { 
            font-size: 9px; 
            letter-spacing: 5px; 
            color: #555; 
            text-transform: uppercase; 
            margin-bottom: 30px; 
            font-weight: 200; 
        }
        
        .balance-val { 
            font-family: 'Playfair Display', serif; 
            font-size: 46px; 
            color: var(--gold); 
            margin-bottom: 45px; 
            font-weight: 400; 
            letter-spacing: -1px;
            -webkit-font-smoothing: antialiased;
        }
        
        .currency { 
            color: var(--gold); 
            font-size: 30px; 
            margin-left: 8px; 
            font-weight: 100; 
            font-family: 'Montserrat', sans-serif;
        }

        .btn-action {
            display: inline-block;
            border: 1px solid var(--gold);
            padding: 14px 45px;
            color: var(--gold);
            text-decoration: none;
            font-size: 10px;
            letter-spacing: 7px;
            text-transform: uppercase;
            font-weight: 200;
        }

        .section-box { width: 90%; max-width: 360px; margin-bottom: 35px; }
        .section-title { 
            font-size: 9px; 
            letter-spacing: 4px; 
            color: #444; 
            text-transform: uppercase; 
            margin-bottom: 25px; 
            border-bottom: 1px solid rgba(255,255,255,0.03); 
            padding-bottom: 12px; 
        }
        
        .row-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 18px 0; 
            border-bottom: 1px solid rgba(255,255,255,0.02); 
        }
        
        .name { font-size: 11px; letter-spacing: 2px; color: var(--gold); font-weight: 300; }
        
        .price-text { 
            font-size: 14px; 
            color: #888; 
            font-weight: 200; 
            font-family: 'Montserrat', sans-serif;
        }
        
        .change { font-size: 10px; margin-left: 8px; font-weight: 500; }
        .up { color: #2ecc71; } .down { color: #e74c3c; }

        .activity-row { 
            display: flex; 
            font-size: 11px; 
            padding: 18px 0; 
            border-bottom: 1px solid rgba(255,255,255,0.02); 
        }
        .time { color: #333; width: 65px; font-weight: 200; }
        .desc { flex: 1; text-align: right; color: var(--gold); font-weight: 200; }
        .desc b { color: #fff; font-weight: 300; }
    </style>
</head>
<body>

    <div class="logo-section">
        <img src="https://raw.githubusercontent.com/loannGray/SIGNET/main/gryphon.png" class="gryphon-img" alt="Signet Heritage Gryphon">
        <div class="logo-text">SIGNET</div>
    </div>

    <div class="balance-frame">
        <div class="label">Current Balance</div>
        <div id="balance" class="balance-val">...</div>
        <a href="#" class="btn-action">Ввод / Вывод</a>
    </div>

    <div class="section-box">
        <div class="section-title">Portfolio</div>
        <div id="portfolio"></div>
    </div>

    <div class="section-box">
        <div class="section-title">Latest Activity</div>
        <div class="activity-row">
            <span class="time">21:40</span>
            <span class="desc">Профит по <b>BRENT +1.2%</b></span>
        </div>
        <div class="activity-row">
            <span class="time">18:15</span>
            <span class="desc">SMC: <b>Слом структуры DXY</b></span>
        </div>
    </div>

    <script>
        async function sync() {
            const url = 'https://indissolubly-semichemical-lashell.ngrok-free.dev'; 
            try {
                const r = await fetch(url + '/balance', { 
                    headers: { 'ngrok-skip-browser-warning': 'true' } 
                });
                const d = await r.json();
                
                // Отображение баланса
                document.getElementById('balance').innerHTML = `${d.balance} <span class="currency">₽</span>`;
                
                // Рендеринг портфеля
                let h = '';
                d.portfolio.forEach(i => {
                    const c = i.change.startsWith('+') ? 'up' : 'down';
                    h += `<div class="row-item">
                            <span class="name">${i.asset}</span>
                            <div class="price-text">
                                ${i.price} <span class="change ${c}">${i.change}</span>
                            </div>
                          </div>`;
                });
                document.getElementById('portfolio').innerHTML = h;
            } catch (e) { console.log("Связь с сервером..."); }
        }
        sync();
        setInterval(sync, 5000);
    </script>
</body>
</html>
