<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIGNET Heritage</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@200;300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #c5a059; --bg: #0d0d0d; }
        body { background-color: var(--bg); color: #fff; font-family: 'Montserrat', sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        .logo { font-family: 'Playfair Display', serif; font-size: 26px; letter-spacing: 12px; color: var(--gold); margin: 40px 0 30px; text-transform: uppercase; font-weight: 400; }

        /* Золотая карточка баланса */
        .balance-frame {
            width: 90%;
            max-width: 360px;
            border: 1px solid rgba(197, 160, 89, 0.35);
            background: linear-gradient(180deg, #121212, #0a0a0a);
            padding: 45px 20px;
            text-align: center;
            box-sizing: border-box;
            margin-bottom: 40px;
        }

        .label { font-size: 10px; letter-spacing: 5px; color: #666; text-transform: uppercase; margin-bottom: 25px; font-weight: 300; }
        
        /* Баланс: ТОНКИЙ шрифт с засечками */
        .balance-val { 
            font-family: 'Playfair Display', serif; 
            font-size: 46px; 
            color: var(--gold); 
            margin-bottom: 40px; 
            font-weight: 300; /* Очень тонкий */
        }
        
        /* Рубль: Тонкий и Золотой */
        .currency { 
            color: var(--gold); 
            font-size: 32px; 
            margin-left: 10px; 
            font-weight: 200; /* Сверхтонкий */
        }

        .btn-action {
            display: inline-block;
            border: 1px solid var(--gold);
            padding: 15px 50px;
            color: var(--gold);
            text-decoration: none;
            font-size: 11px;
            letter-spacing: 6px;
            text-transform: uppercase;
        }

        /* Портфолио: Утонченный стиль */
        .section-box { width: 90%; max-width: 360px; margin-bottom: 30px; }
        .section-title { font-size: 10px; letter-spacing: 3px; color: #666; text-transform: uppercase; margin-bottom: 25px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 10px; }
        
        .row-item { display: flex; justify-content: space-between; align-items: flex-end; padding: 20px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .name { font-size: 12px; letter-spacing: 2px; color: var(--gold); font-weight: 300; }
        .data { text-align: right; }
        
        /* Цены: Утонченные и Тонкие */
        .price { font-size: 14px; color: #fff; margin-bottom: 4px; font-weight: 400; font-family: 'Montserrat', sans-serif;}
        .change { font-size: 10px; font-weight: 600; }

        /* Активность */
        .activity-row { display: flex; font-size: 11px; padding: 18px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .time { color: #333; width: 65px; font-weight: 300; }
        .desc { flex: 1; text-align: right; color: var(--gold); font-weight: 300; }
        .desc b { color: #fff; font-weight: 400; }

        .up { color: #2ecc71; } .down { color: #e74c3c; }
    </style>
</head>
<body>

    <div class="logo">SIGNET</div>

    <div class="balance-frame">
        <div class="label">Current Balance</div>
        <div id="balance" class="balance-val">...</div>
        <a href="#" class="btn-action">Ввод / Вывод</a>
    </div>

    <div class="section-box">
        <div class="section-title">Portfolio</div>
        <div id="portfolio"></div>
    </div>

    <div class="section-box">
        <div class="section-title">Latest Activity</div>
        <div class="activity-row">
            <span class="time">21:40</span>
            <span class="desc">Профит по <b>BRENT +1.2%</b></span>
        </div>
        <div class="activity-row">
            <span class="time">18:15</span>
            <span class="desc">SMC: <b>Слом структуры DXY</b></span>
        </div>
    </div>

    <script>
        async function sync() {
            // ТВОЯ АКТУАЛЬНАЯ ССЫЛКА NGROK
            const url = 'https://indissolubly-semichemical-lashell.ngrok-free.dev'; 
            try {
                const r = await fetch(url + '/balance', { headers: { 'ngrok-skip-browser-warning': 'true' } });
                const d = await r.json();
                
                // Исправляем баланс: Тонкий Playfair и Золотой ₽
                document.getElementById('balance').innerHTML = `${d.balance} <span class="currency">₽</span>`;
                
                let h = '';
                d.portfolio.forEach(i => {
                    const c = i.change.startsWith('+') ? 'up' : 'down';
                    // Исправляем портфолио: Тонкие цены (Montserrat 400)
                    h += `<div class="row-item">
                            <span class="name">${i.asset}</span>
                            <div class="data">
                                <div class="price">$${i.price}</div>
                                <div class="change ${c}">${i.change}</div>
                            </div>
                          </div>`;
                });
                document.getElementById('portfolio').innerHTML = h;
            } catch (e) { console.log("Connection lost..."); }
        }
        sync();
        setInterval(sync, 5000);
    </script>
</body>
</html>
