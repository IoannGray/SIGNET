<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIGNET</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { background-color: #0a0b0d; color: #c5a059; font-family: 'Montserrat', sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .header { font-family: 'Playfair Display', serif; font-size: 22px; letter-spacing: 6px; margin-top: 50px; margin-bottom: 40px; text-transform: uppercase; }
        .balance-section { width: 100%; max-width: 350px; text-align: center; margin-bottom: 50px; }
        .balance-value { font-family: 'Playfair Display', serif; font-size: 46px; font-weight: 700; color: #fff; margin: 0; }
        .asset-row { display: flex; justify-content: space-between; align-items: center; padding: 18px 0; border-bottom: 1px solid #1a1c1f; width: 100%; max-width: 350px;}
        .up { color: #2ecc71; } .down { color: #e74c3c; }
    </style>
</head>
<body>
    <div class="header">SIGNET</div>
    <div class="balance-section">
        <div style="font-size: 10px; color: #666; letter-spacing: 3px;">TOTAL ASSETS</div>
        <div id="balance" class="balance-value">...</div>
    </div>
    <div id="portfolio" style="width: 100%; max-width: 350px;"></div>

    <script>
        async function update() {
            //'https://indissolubly-semichemical-lashell.ngrok-free.dev';

            const baseUrl = 'https://indissolubly-semichemical-lashell.ngrok-free.dev'; 
            
            try {
                const r = await fetch(baseUrl + '/balance', {
                    method: 'GET',
                    headers: { 'ngrok-skip-browser-warning': 'true' } // ЭТО УБЕРЕТ ОКНО ОТ NGROK
                });
                const d = await r.json();
                document.getElementById('balance').innerHTML = d.balance + '<span style="color:#c5a059; font-size:28px;">₽</span>';
                
                let html = '';
                d.portfolio.forEach(i => {
                    const c = i.change.startsWith('+') ? 'up' : 'down';
                    html += `<div class="asset-row">
                        <span style="color:#8a8d91; text-transform:uppercase; font-size:13px;">${i.asset}</span>
                        <div style="text-align:right">
                            <div style="color:#fff;">$${i.price}</div>
                            <div class="${c}" style="font-size:11px;">${i.change}</div>
                        </div>
                    </div>`;
                });
                document.getElementById('portfolio').innerHTML = html;
            } catch (e) {
                document.getElementById('balance').innerText = "Ошибка";
                console.error(e);
            }
        }
        update();
        setInterval(update, 5000);
    </script>
</body>
</html>
