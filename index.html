<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SIGNET</title>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            /* Фоновое изображение со скриншота */
            background: url('https://w.forfun.com/fetch/88/88788f0412803b9b4624326570973307.jpeg') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Inter', sans-serif;
            color: #E2C28B; /* Мягкое золото */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-end; /* Контент прижат к низу, как на мобильных интерфейсах */
        }

        /* Затемнение фона для читаемости */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.8) 100%);
            z-index: 1;
        }

        .app-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 440px;
            padding: 30px 20px;
            /* Эффект матового стекла для блоков */
            background: rgba(10, 10, 10, 0.4);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-top: 1px solid rgba(226, 194, 139, 0.2);
            border-radius: 40px 40px 0 0;
        }

        .header-brand {
            font-family: 'EB Garamond', serif;
            text-align: center;
            font-size: 26px;
            letter-spacing: 0.4em;
            margin-bottom: 40px;
            text-transform: uppercase;
        }

        .balance-block {
            text-align: center;
            margin-bottom: 40px;
        }

        .balance-label {
            font-size: 10px;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            opacity: 0.7;
            margin-bottom: 10px;
        }

        .balance-value {
            font-family: 'EB Garamond', serif;
            font-size: 54px;
            font-weight: 400;
        }

        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1px;
            background: rgba(226, 194, 139, 0.2);
            margin-bottom: 40px;
            border: 1px solid rgba(226, 194, 139, 0.2);
        }

        .action-item {
            background: rgba(10, 10, 10, 0.5);
            padding: 15px;
            text-align: center;
            font-size: 12px;
            letter-spacing: 0.2em;
            cursor: pointer;
            transition: 0.3s;
        }

        .action-item:active {
            background: rgba(226, 194, 139, 0.1);
        }

        .section-header {
            font-family: 'EB Garamond', serif;
            font-style: italic;
            font-size: 18px;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(226, 194, 139, 0.1);
            padding-bottom: 5px;
        }

        .asset-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            font-size: 14px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .ticker { font-weight: 600; letter-spacing: 1px; }
        .price { font-family: 'Inter', sans-serif; }
        .up { color: #A4C639; }
        .down { color: #E57373; }

        .footer-info {
            text-align: center;
            font-size: 9px;
            margin-top: 30px;
            opacity: 0.4;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header-brand">SIGNET</div>

    <div class="balance-block">
        <div class="balance-label">Available Assets</div>
        <div class="balance-value">12,500.50 ₽</div>
    </div>

    <div class="action-grid">
        <div class="action-item" onclick="alert('Deposit')">DEPOSIT</div>
        <div class="action-item" onclick="alert('Withdraw')">WITHDRAW</div>
    </div>

    <div class="section-header">Market Snapshot</div>
    <div class="asset-list">
        <div class="asset-row">
            <span class="ticker">GOLD</span>
            <span class="price">2,150.40 <span class="up">+0.4%</span></span>
        </div>
        <div class="asset-row">
            <span class="ticker">BRENT</span>
            <span class="price">82.30 <span class="down">-1.1%</span></span>
        </div>
        <div class="asset-row">
            <span class="ticker">BTC</span>
            <span class="price">67,200.15 <span class="up">+2.3%</span></span>
        </div>
    </div>

    <div class="footer-info">EST. 2026 • TRADERS CLUB</div>
</div>

</body>
</html>
