<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #1a1a1a; color: #c5a059; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { border: 1px solid #c5a059; padding: 40px; text-align: center; width: 250px; background: #222; }
        h1 { font-size: 40px; margin: 10px 0; font-family: serif; }
        .btn { border: 1px solid #c5a059; color: #c5a059; padding: 10px 20px; margin-top: 20px; text-transform: uppercase; background: none; width: 100%; }
    .balance-value { transition: all 0.3s ease; }
    </style>
</head>
<body>
    <div style="letter-spacing: 5px; margin-bottom: 20px;">SIGNET</div>
    <div class="card">
        <div style="font-size: 10px; color: #888;">BALANCE</div>
        <h1 class="balance-value">... <span class="currency">₽</span></h1>
        <button class="btn" onclick="window.Telegram.WebApp.showAlert('Система SIGNET активна')">Ввод / Вывод</button>
    </div>
    <script>window.Telegram.WebApp.ready(); window.Telegram.WebApp.expand();</script>
<script>
    window.Telegram.WebApp.ready();
    window.Telegram.WebApp.expand();

    async function updateBalance() {
        try {
            // Добавляем случайный параметр ?t=, чтобы обмануть кэш
            const response = await fetch('https://indissolubly-semichemical-lashell.ngrok-free.dev/balance?t=' + Date.now(), {
                headers: {
                    'ngrok-skip-browser-warning': 'true'
                }
            });
            const data = await response.json();

            // Ищем именно тот элемент, который мы пометили классом
            const el = document.querySelector('.balance-value');
            if (el) {
                el.innerHTML = data.balance + ' <span class="currency">₽</span>';
            }
        } catch (e) {
            console.log('Ошибка связи');
        }
    }

    // Запускаем сразу и потом каждые 5 секунд
    updateBalance();
    setInterval(updateBalance, 5000);
</script>
   </body>
</html>
