<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SIGNET — Private Banking</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #3D3D3D; /* Тот самый серый графит с твоего скриншота */
            font-family: 'Inter', sans-serif;
            color: #E2C28B;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding-top: 50px;
        }

        .app-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            text-align: center;
        }

        /* Логотип в стиле банковского клише */
        .brand-logo {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            letter-spacing: 0.5em;
            text-transform: uppercase;
            margin-bottom: 60px;
            font-weight: 400;
        }

        .label {
            font-size: 10px;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            opacity: 0.6;
            margin-bottom: 15px;
        }

        /* Главная сумма - шрифт как на чеке */
        .main-balance {
            font-family: 'Playfair Display', serif;
            font-size: 52px;
            font-weight: 400;
            margin-bottom: 50px;
        }

        /* Кнопки ВВОД / ВЫВОД с тонкими рамками */
        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            border: 0.5px solid rgba(226, 194, 139, 0.4);
            margin-bottom: 60px;
        }

        .btn-item {
            padding: 18px;
            font-size: 12px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            border-right: 0.5px solid rgba(226, 194, 139, 0.4);
            cursor: pointer;
        }

        .btn-item:last-child { border-right: none; }

        /* Списки котировок */
        .section-title {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            text-align: left;
            font-size: 18px;
            margin-bottom: 20px;
            border-bottom: 0.5px solid rgba(226, 194, 139, 0.2);
            padding-bottom: 10px;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            font-size: 14px;
            border-bottom: 0.5px solid rgba(255, 255, 255, 0.05);
        }

        .ticker { font-weight: 600; letter-spacing: 0.1em; }
        .price-info { font-family: 'Inter', sans-serif; }
        
        .up { color: #A4C639; }
        .down { color: #E57373; }

        .footer {
            margin-top: 50px;
            font-size: 9px;
            letter-spacing: 0.2em;
            opacity: 0.4;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="brand-logo">SIGNET</div>

    <div class="label">Available Assets</div>
    <div class="main-balance">12,500.50 ₽</div>

    <div class="btn-group">
        <div class="btn-item">Deposit</div>
        <div class="btn-item">Withdraw</div>
    </div>

    <div class="section-title">Market Snapshot</div>
    
    <div class="data-row">
        <span class="ticker">GOLD</span>
        <span class="price-info">2,150.40 <span class="up">+0.4%</span></span>
    </div>
    <div class="data-row">
        <span class="ticker">BRENT</span>
        <span class="price-info">82.30 <span class="down">-1.1%</span></span>
    </div>
    <div class="data-row">
        <span class="ticker">BTC</span>
        <span class="price-info">67,200.15 <span class="up">+2.3%</span></span>
    </div>

    <div class="footer">EST. 2026 • TRADERS CLUB</div>
</div>

<script>
    // Твой актуальный адрес из терминала
    const API_LINK = "https://6e36be656d2a85.lhr.life"; 

    async function loadData() {
        try {
            const r = await fetch(`${API_LINK}/portfolio`);
            const d = await r.json();
            // Обновление цифр в реальном времени
        } catch(e) {}
    }
    setInterval(loadData, 30000);
</script>

</body>
</html>
